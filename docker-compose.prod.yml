# Produksi: HANYA service API kg-agent. Neo4j & Ollama adalah service EKSTERNAL
# (KG Nabhyla + server Ollama) yang dijangkau lewat .env - tidak dibundel.
#
# Pakai:
#   cp .env.docker.example .env      # isi endpoint & profil skema
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec agent \
#       python scripts/smoke_endpoint.py --url http://localhost:8000
#
# Ollama co-located di Linux? Pakai docker-compose.host.yml, bukan berkas ini.
#
# ---------------------------------------------------------------------------
# BERKAS INI = BRIDGE. PAKAI HANYA KALAU OLLAMA ADA DI MESIN LAIN.
# ---------------------------------------------------------------------------
# Di dalam container, `localhost` menunjuk container itu sendiri, BUKAN host.
# Di Docker LINUX, Ollama yang co-located TIDAK bisa dijangkau dari sini: secara
# default ia hanya listen di 127.0.0.1 dan menolak koneksi dari container apa
# pun alamat yang dipakai. Bridge di bawah lulus uji di macOS hanya karena
# Docker Desktop memperlakukan host.docker.internal secara khusus.
#
#   Ollama di MESIN LAIN (IP tailscale)  -> berkas INI, jalan apa adanya.
#       .env: OLLAMA_URL=http://<ip-tailscale>:11434 (juga KG_EMBED_URL,
#       KG_JUDGE_OLLAMA_URL). IP tailnet dirutekan host seperti IP biasa.
#
#   Ollama di mesin YANG SAMA (Linux)    -> pakai docker-compose.host.yml:
#       docker compose -f docker-compose.host.yml up -d --build
#       .env: ketiga URL Ollama = http://localhost:11434
#
# Salah pilih GAGAL SENYAP: /health tetap hijau (ia hanya menguji Neo4j)
# sementara setiap jawaban balik kosong. Selalu buktikan dengan
# scripts/smoke_endpoint.py, jangan berhenti di /health.
#
# Neo4j lewat IP tailscale (100.x) tidak terpengaruh pilihan ini.
# ---------------------------------------------------------------------------
#
# CATATAN UJI: bridge di bawah diuji LULUS di macOS (Docker Desktop), termasuk
# build, /health, HEALTHCHECK, retrieval nyata, dan guard tulis 403. Di Linux
# yang diuji hanya jalur Ollama-remote; jalur Ollama co-located memang tidak
# didukung berkas ini - pakai docker-compose.host.yml.
# ---------------------------------------------------------------------------
#
# Butuh Docker yang seccomp-nya mengizinkan clone3 kalau memakai base image
# bookworm. Dockerfile sengaja memakai bullseye supaya build tetap jalan di
# Docker lama (diuji: 20.10.2 gagal dengan bookworm, berhasil dengan bullseye).
services:
  agent:
    build: .
    image: kg-agent-api
    ports:
      - "8003:8000"          # HOST:8003 (port "lab-brain-agent") -> container:8000. 8000 sudah dipakai lab-brain-backend di server. Rio pakai http://<host>:8003
    env_file:
      - .env
    extra_hosts:
      # Supaya container bisa menjangkau Ollama/Neo4j yang jalan di host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped   # selalu hidup untuk meeting
    # healthcheck sengaja TIDAK didefinisikan di sini - image sudah membawanya
    # (lihat HEALTHCHECK di Dockerfile), sehingga `docker run` tanpa compose pun
    # tetap terpantau. Definisi di compose akan menimpa milik image dan membuat
    # dua tempat yang harus diubah bersamaan.
